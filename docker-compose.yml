name: opensesame

services:
  opensesame:
    image: ghcr.io/qwerto107/opensesame:latest
    container_name: opensesame
    restart: unless-stopped
    cap_add:
      - NET_RAW
    ports:
      - "127.0.0.1:18010:18010"
    env_file:
      - .env
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "/opensesame-web", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
