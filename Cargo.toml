[package]
name = "opensesame"
version = "1.0.2"
edition = "2024"
description = "跨平台 TCP / UDP 端口敲门客户端"
build = "build.rs"

[features]
qa = ["dep:image"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
sys-locale = "0.3"
fontique = { version = "=0.11.1", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
socket2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "=1.18.1"
rspolib = "0.1.2"
embed-resource = "3.0"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

