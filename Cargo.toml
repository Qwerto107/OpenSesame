[package]
name = "opensesame"
version = "1.0.4"
edition = "2024"
description = "跨平台 TCP / UDP 端口敲门客户端"
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dep:slint", "dep:fontique", "dep:slint-build", "dep:embed-resource"]
qa = ["desktop", "dep:image"]
web = ["dep:axum", "dep:rusqlite", "dep:argon2", "dep:rand", "dep:sha2", "dep:base64", "dep:reqwest", "dep:jsonwebtoken", "dep:futures-util"]

[[bin]]
name = "opensesame"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "opensesame-web"
path = "src/bin/opensesame-web.rs"
required-features = ["web"]

[dependencies]
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
sys-locale = "0.3"
fontique = { version = "=0.11.1", optional = true, default-features = false, features = ["system"] }
axum = { version = "0.8", optional = true }
futures-util = { version = "0.3", optional = true }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
argon2 = { version = "0.5", optional = true }
rand = { version = "0.8", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
jsonwebtoken = { version = "9.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
socket2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }
rspolib = "0.1.2"
embed-resource = { version = "3.0", optional = true }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

