name: 构建、检查与发布

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      ["src/**", "ui/**", "assets/**", "i18n/**", "scripts/**", ".github/**", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", ".gitattributes", "docs/binary.md", "docs/releasing.md"]
  pull_request:
    paths:
      ["src/**", "ui/**", "assets/**", "i18n/**", "scripts/**", ".github/**", "Cargo.toml", "Cargo.lock", "build.rs", "rust-toolchain.toml", ".gitattributes", "docs/binary.md", "docs/releasing.md"]
  workflow_dispatch:
    inputs:
      full_checks:
        description: "运行依赖漏洞检查"
        type: boolean
        default: false

permissions:
  contents: read

# 日常检查保留最新提交；版本发布不能中途取消。
concurrency:
  group: opensesame-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust 检查
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-pc-windows-gnu
      - name: 校验版本、格式与静态问题
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            [[ ${#tag} -le 100 && "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
            version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "opensesame") | .version')"
            [[ "$version" == "${tag#v}" ]]
          fi
          bash scripts/build.sh fmt
          bash scripts/build.sh lint
      - name: 单元测试
        run: bash scripts/build.sh test
      - name: 依赖漏洞检查
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.full_checks)
        run: |
          cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          cargo audit --file Cargo.lock

  binaries:
    name: 二进制构建（${{ matrix.platform }}）
    needs: rust
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-amd64, runner: windows-latest, target: x86_64-pc-windows-gnu }
          - { platform: linux-amd64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux-arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: darwin-amd64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: darwin-arm64, runner: macos-15, target: aarch64-apple-darwin }
    env:
      PACKAGE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
      - name: 构建、打包与生成校验文件
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File .github/scripts/package-binary.ps1
          else
            bash .github/scripts/package-binary.sh "$PACKAGE_PLATFORM"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: opensesame-binaries-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: 发布版本二进制附件
    needs: binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: opensesame-binaries-*
          merge-multiple: true
          path: release-assets/
      - name: 上传、核对附件并公开 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/publish-release.sh
